<style>body{font:15px system-ui,sans-serif;margin:0;background:#f6f8fb;color:#172437}header{padding:22px 32px;background:white;border-bottom:1px solid #dde3eb}h1{margin:0 0 6px}p{margin:5px 0;color:#536278}.layout{display:flex;gap:18px;padding:22px;align-items:flex-start}.graph{background:white;border:1px solid #dde3eb;border-radius:12px;overflow:auto;flex:1}aside{width:275px;background:white;border:1px solid #dde3eb;border-radius:12px;padding:20px;position:sticky;top:20px}aside h2{font-size:18px;margin:0 0 13px}.node{cursor:pointer}.node rect{stroke-width:1.4}.node.source rect{fill:#e5eaf0;stroke:#8492a6}.node.stage rect{fill:#d9ebff;stroke:#4d8ac1}.node.mart rect{fill:#d9f4e8;stroke:#3f9b77}.node text{fill:#1b2b42;font:13px system-ui,sans-serif}.node.active rect{stroke:#e08724;stroke-width:3}.node.faded,.edge.faded{opacity:.16}.edge{fill:none;stroke:#7189a4;stroke-width:2.1}.muted{color:#697789}.tag{display:inline-block;margin:3px 2px;padding:4px 7px;border-radius:5px;background:#eef2f7;font-size:12px}button{padding:7px 11px;border:1px solid #cbd5df;border-radius:7px;background:white;cursor:pointer}@media(max-width:800px){.layout{display:block}aside{width:auto;position:static;margin-top:12px}}</style>
<header><h1>SQL Data Lineage</h1><p>Klik op een tabel om de upstream-bronnen en downstream-afhankelijkheden te zien.</p></header><div class="layout"><div class="graph"><svg id="graph" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 590" style="min-width:800px;width:100%"><path class="edge" data-src="Customers" data-dst="stg_customers" d="M240,85 C320,85 260,85 340,85"/>

<script>const scripts=[{"script": "01_stg_customers.sql", "target": "stg_customers", "sources": ["Customers"], "dependencies": []}, {"script": "02_stg_products.sql", "target": "stg_products", "sources": ["Products"], "dependencies": []}, {"script": "03_stg_orders.sql", "target": "stg_orders", "sources": ["Orders"], "dependencies": []}, {"script": "04_stg_order_items.sql", "target": "stg_order_items", "sources": ["OrderItems"], "dependencies": []}, {"script": "05_mart_customer_revenue.sql", "target": "mart_customer_revenue", "sources": ["stg_customers", "stg_orders", "stg_order_items"], "dependencies": ["01_stg_customers.sql", "03_stg_orders.sql", "04_stg_order_items.sql"]}, {"script": "06_mart_product_sales.sql", "target": "mart_product_sales", "sources": ["stg_products", "stg_order_items", "stg_orders"], "dependencies": ["02_stg_products.sql", "04_stg_order_items.sql", "03_stg_orders.sql"]}];const edges=scripts.flatMap(s=>s.sources.map(src=>[src,s.target]));function reachable(start,reverse=false){let seen=new Set(),queue=[start];while(queue.length){let n=queue.shift();for(let [a,b] of edges){let from=reverse?b:a,to=reverse?a:b;if(from===n&&!seen.has(to)){seen.add(to);queue.push(to)}}}return seen}function choose(name){let up=reachable(name,true),down=reachable(name),included=new Set([name,...up,...down]);document.querySelectorAll('.node').forEach(n=>{n.classList.toggle('faded',!included.has(n.dataset.name));n.classList.toggle('active',n.dataset.name===name)});document.querySelectorAll('.edge').forEach(e=>e.classList.toggle('faded',!(included.has(e.dataset.src)&&included.has(e.dataset.dst))));let s=scripts.find(s=>s.target===name);document.getElementById('selected').textContent=name;let fmt=names=>names.length?names.sort().map(n=>'<span class="tag">'+escapeHtml(n)+'</span>').join(''):'Geen';document.getElementById('details').innerHTML='<p><b>SQL script:</b><br>'+(s?'<span class="tag">'+escapeHtml(s.script)+'</span>':'Brontabel')+'</p><p><b>Dependencies:</b><br>'+fmt(s?s.dependencies:[])+'</p><p><b>Directe input-tabellen:</b><br>'+fmt(s?s.sources:[])+'</p><p><b>Upstream-tabellen:</b><br>'+fmt([...up])+'</p><p><b>Downstream-tabellen:</b><br>'+fmt([...down])+'</p>'}function escapeHtml(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function reset(){document.querySelectorAll('.node,.edge').forEach(n=>n.classList.remove('faded','active'));document.getElementById('selected').textContent='Selecteer een tabel';document.getElementById('details').textContent='Grijs = bron; blauw = staging; groen = eindtabel.'}document.querySelectorAll('.node').forEach(n=>{n.addEventListener('click',()=>choose(n.dataset.name));n.addEventListener('keydown',e=>{if(e.key==='Enter')choose(n.dataset.name)})});</script></html>
